# Envía el recordatorio "suba las fotos" a los teléfonos que lo activaron en /admin/.
#
# GitHub a veces atrasa horas o se salta las tareas programadas. Por eso no se programa
# una sola vez, sino cada 15 minutos durante 2 horas en cada horario. El script envía
# UNA sola vez por horario (lo anota en notificaciones/enviados.json) y nunca fuera
# de esas horas. Ecuador es UTC-5 (sin horario de verano):
#   15:00–16:59 UTC = 10:00–11:59 en Ecuador     21:00–22:59 UTC = 16:00–17:59 en Ecuador
#
# El aviso principal lo dispara cron-job.org a las 10:00 y 16:00 (llama a esta acción con
# origen = "reloj", que respeta el horario). Lo programado aquí abajo queda como respaldo.
# Al lanzarla a mano desde GitHub (origen = "manual") envía siempre, para probar.
name: Recordatorios de fotos

on:
  schedule:
    - cron: '3,18,33,48 15,16 * * 1-5' # mañana, de lunes a viernes
    - cron: '3,18,33,48 21,22 * * 1-5' # tarde, de lunes a viernes
  workflow_dispatch:
    inputs:
      mensaje:
        description: 'Mensaje de prueba (opcional)'
        required: false
      origen:
        description: 'manual = enviar ya (prueba) · reloj = solo si es la hora del recordatorio'
        required: false
        default: manual

permissions:
  contents: write

concurrency: recordatorios

jobs:
  enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: ¿Toca enviar?
        id: check
        run: node .github/scripts/recordatorios.mjs --check
        env:
          FORZAR: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.origen != 'reloj' && '1' || '0' }}
      - name: Instalar web-push
        if: steps.check.outputs.send == 'true'
        run: npm install --no-save --no-package-lock --prefix .github/scripts web-push@3.6.7
      - name: Enviar notificaciones
        if: steps.check.outputs.send == 'true'
        run: node .github/scripts/recordatorios.mjs
        env:
          PUSH_SECRET: ${{ secrets.PUSH_SECRET }}
          MENSAJE: ${{ github.event.inputs.mensaje }}
          FORZAR: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.origen != 'reloj' && '1' || '0' }}
      - name: Guardar envío y quitar teléfonos que ya no reciben
        if: steps.check.outputs.send == 'true'
        run: |
          git add notificaciones/
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Recordatorio enviado"
            git pull --rebase --quiet
            git push
          fi
